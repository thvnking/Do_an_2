services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cinemind
      POSTGRES_USER: cinemind
      POSTGRES_PASSWORD: cinemind_dev_password
    ports: ["5432:5432"]
    volumes:
      - cinemind_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinemind -d cinemind"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      PORT: 10000
      DATABASE_URL: postgresql://cinemind:cinemind_dev_password@db:5432/cinemind
      CORS_ORIGIN: http://localhost:8080
    ports: ["3001:10000"]
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports: ["8080:10000"]
    depends_on: [api]
volumes:
  cinemind_db:
