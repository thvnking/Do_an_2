server {
    listen 10000;
    server_name _;
    resolver __DNS_RESOLVER__ valid=30s;
    root /usr/share/nginx/html;
    index index.html;
    location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }
    location /api/ {
        set $api_host __API_HOST__;
        set $api_port __API_PORT__;
        proxy_pass __API_SCHEME__://$api_host:$api_port;
        proxy_http_version 1.1;
        proxy_set_header Host $api_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_name $api_host;
        proxy_read_timeout 60s;
    }
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|woff2)$ { expires 7d; add_header Cache-Control "public, max-age=604800, immutable"; try_files $uri =404; }
}
